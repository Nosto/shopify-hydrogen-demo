# Don't change the line below!
#! oxygen_storefront_id: 1343547

name: Storefront 1343547
on: [ push ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a #v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '22.x'
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca #v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-


      - name: Install dependencies
        id: 'install-dependencies'
        run: npm ci

      - name: Set deployment environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DEPLOY_ENV=production" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOY_ENV=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Publish to Oxygen
        id: deploy
        # Builds with `react-router build` and deploys dist/client + dist/server (see package.json).
        # In CI the CLI writes the deployment details, including its URL, to h2_deploy_log.json.
        run: |
          npm run deploy
          echo "url=$(jq -r '.url // empty' h2_deploy_log.json)" >> "$GITHUB_OUTPUT"
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1343547 }}

      # Create GitHub Deployment
      - name: Create GitHub Deployment
        uses: shopify/github-deployment-action@v1
        if: always()
        with:
          token: ${{ github.token }}
          environment: ${{ steps.set-env.outputs.DEPLOY_ENV }}
          preview_url: ${{ steps.deploy.outputs.url }}
          description: ${{ github.event.head_commit.message }}
