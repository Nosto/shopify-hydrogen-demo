# Don't change the line below!
#! oxygen_storefront_id: 1343547

name: Storefront 1343547
on: [ push ]

permissions:
  contents: read

jobs:
  build:
    name: Build and typecheck
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '22.x'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Deploys only when a change lands on main, after the build job passes
  deploy:
    name: Deploy to Oxygen
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: '22.x'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish to Oxygen
        # Builds with `react-router build` and deploys dist/client + dist/server (see package.json)
        run: npm run deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1343547 }}
